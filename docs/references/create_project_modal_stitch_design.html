<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-error-container": "#ffdad6",
            "outline": "#958da1",
            "surface-container-low": "#131b2e",
            "surface-container-highest": "#2d3449",
            "surface-container": "#171f33",
            "tertiary-fixed": "#ffdcc6",
            "secondary-fixed": "#eaddff",
            "on-surface-variant": "#ccc3d8",
            "surface-tint": "#d2bbff",
            "on-tertiary-container": "#ffe0cd",
            "primary-fixed-dim": "#d2bbff",
            "on-tertiary-fixed": "#301400",
            "secondary": "#d2bbff",
            "on-secondary": "#3b1e6f",
            "surface-bright": "#31394d",
            "on-primary": "#3f008e",
            "on-secondary-fixed": "#25005a",
            "surface": "#0b1326",
            "primary-container": "#7c3aed",
            "inverse-surface": "#dae2fd",
            "tertiary": "#ffb784",
            "primary": "#d2bbff",
            "on-secondary-container": "#c3a6ff",
            "primary-fixed": "#eaddff",
            "on-tertiary": "#4f2500",
            "on-background": "#dae2fd",
            "on-primary-container": "#ede0ff",
            "tertiary-container": "#a15100",
            "secondary-container": "#523787",
            "surface-dim": "#0b1326",
            "inverse-primary": "#732ee4",
            "error-container": "#93000a",
            "on-primary-fixed": "#25005a",
            "on-primary-fixed-variant": "#5a00c6",
            "on-secondary-fixed-variant": "#523787",
            "surface-container-lowest": "#060e20",
            "secondary-fixed-dim": "#d2bbff",
            "tertiary-fixed-dim": "#ffb784",
            "surface-container-high": "#222a3d",
            "surface-variant": "#2d3449",
            "background": "#0b1326",
            "inverse-on-surface": "#283044",
            "on-tertiary-fixed-variant": "#713700",
            "error": "#ffb4ab",
            "on-error": "#690005",
            "outline-variant": "#4a4455",
            "on-surface": "#dae2fd"
          },
          fontFamily: {
            "headline": ["Inter"],
            "body": ["Inter"],
            "label": ["Inter"]
          },
          borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0b1326;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #2d3449;
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Background Dashboard (SCR-002 Placeholder) -->
<div class="flex h-screen w-screen blur-[2px] pointer-events-none brightness-50">
<!-- SideNavBar -->
<aside class="bg-[#131b2e] flex flex-col h-screen py-8 px-4 w-64 shrink-0 font-['Inter'] text-sm font-medium">
<div class="mb-10 px-2">
<h1 class="text-lg font-black text-[#dae2fd]">Project Workspace</h1>
<p class="text-on-surface-variant text-[10px] uppercase tracking-widest mt-1">Software Planning</p>
</div>
<nav class="space-y-4 flex-1">
<a class="flex items-center gap-3 px-3 py-2 text-[#ccc3d8] hover:bg-[#2d3449] transition-all translate-x-1 duration-200" href="#">
<span class="material-symbols-outlined">input</span>
<span>Input Phase</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 text-[#7c3aed] font-bold border-r-2 border-[#7c3aed] transition-all" href="#">
<span class="material-symbols-outlined">analytics</span>
<span>Monitoring</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 text-[#ccc3d8] hover:bg-[#2d3449] transition-all" href="#">
<span class="material-symbols-outlined">archive</span>
<span>Archive</span>
</a>
</nav>
<button class="mt-auto bg-primary-container text-on-primary-container py-3 rounded flex items-center justify-center gap-2 font-bold tracking-tight">
<span class="material-symbols-outlined">add</span>
<span>New Pipeline</span>
</button>
</aside>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col">
<!-- TopNavBar -->
<header class="bg-[#0b1326] flex justify-between items-center w-full px-6 h-14 font-['Inter'] antialiased tracking-tight">
<div class="flex items-center gap-6">
<span class="text-xl font-bold tracking-tighter text-[#dae2fd]">Magic Planner</span>
<nav class="flex gap-4">
<a class="text-[#dae2fd] border-b-2 border-[#7c3aed] pb-1" href="#">Dashboard</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="text-[#ccc3d8] hover:bg-[#31394d] p-2 transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant">
<img alt="User Settings Profile" class="w-full h-full object-cover" data-alt="Professional user profile headshot with neutral background and soft studio lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCka4D-WGH5pvhTK79zGCjwBAHbU4pm6kZmYWD4aaPcUDzXfE-rT58vVHOvBO6Du-5tycaVlNb9OmEf7xhtBvTgh59csh6lVjaFOjAxWNF6GBB2NH8w9oA2pC60TlwVxXnfOrWDV-2NHvjWqFZ7Q9_3NO2_vVKRCvmUUwS5ZxvlrcSG9ZgGZTbSWpBv-qTFqvFPzRQOCQ9N0fvGIC7Uc9LmNjDp9MNj_Vv25vLd6dxjHzeuHMwZSrrLHR5ZaBFns2ghN-gX1uw_XMk"/>
</div>
</div>
</header>
<!-- Dashboard Content -->
<section class="p-8 grid grid-cols-12 gap-6">
<div class="col-span-8 space-y-6">
<div class="h-64 bg-surface-container-low rounded-xl"></div>
<div class="grid grid-cols-2 gap-6">
<div class="h-40 bg-surface-container-low rounded-xl"></div>
<div class="h-40 bg-surface-container-low rounded-xl"></div>
</div>
</div>
<div class="col-span-4 h-full bg-surface-container-lowest rounded-xl"></div>
</section>
</main>
</div>
<!-- MODAL OVERLAY: [SCR-002-M01] New Project Modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-6 sm:p-0">
<!-- Backdrop with Glassmorphism -->
<div class="absolute inset-0 bg-surface-dim/80 backdrop-blur-md"></div>
<!-- Modal Container -->
<div class="relative w-full max-w-[480px] bg-surface-container border border-outline-variant/15 rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.6)] overflow-hidden">
<!-- Modal Header -->
<div class="px-8 pt-8 pb-6 flex items-center justify-between">
<div class="space-y-1">
<h2 class="text-2xl font-bold tracking-tight text-on-surface">Create New Project</h2>
<p class="text-xs text-on-surface-variant font-label uppercase tracking-widest">Initialization Phase</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-2">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<form class="px-8 pb-10 space-y-8">
<!-- Project Name Input -->
<div class="space-y-2">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest" for="project-name">
            Project Name
          </label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-lg px-4 py-3 text-on-surface placeholder:text-outline/40 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all text-sm font-medium" id="project-name" name="project-name" placeholder="e.g., AI Healthcare App" type="text"/>
<div class="absolute inset-0 rounded-lg pointer-events-none group-focus-within:shadow-[0_0_8px_rgba(210,187,255,0.15)]"></div>
</div>
</div>
<!-- Radio Group: Execution Mode -->
<div class="space-y-4">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest">
            Pipeline Execution Mode
          </label>
<div class="grid grid-cols-2 gap-4">
<!-- Option AUTO -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="execution-mode" type="radio" value="auto"/>
<div class="flex items-center gap-3 px-4 py-4 rounded-lg bg-surface-container-low border border-outline-variant/20 peer-checked:bg-surface-container-highest peer-checked:border-primary transition-all">
<div class="w-5 h-5 rounded-full border-2 border-outline/30 peer-checked:group-[]:border-primary flex items-center justify-center transition-all">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 group-has-[:checked]:scale-100 transition-transform duration-200"></div>
</div>
<div>
<span class="block text-sm font-bold text-on-surface group-has-[:checked]:text-primary transition-colors">AUTO</span>
<span class="block text-[10px] text-on-surface-variant mt-0.5">Continuous Logic flow</span>
</div>
</div>
</label>
<!-- Option MANUAL -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="execution-mode" type="radio" value="manual"/>
<div class="flex items-center gap-3 px-4 py-4 rounded-lg bg-surface-container-low border border-outline-variant/20 peer-checked:bg-surface-container-highest peer-checked:border-primary transition-all">
<div class="w-5 h-5 rounded-full border-2 border-outline/30 peer-checked:group-[]:border-primary flex items-center justify-center transition-all">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 group-has-[:checked]:scale-100 transition-transform duration-200"></div>
</div>
<div>
<span class="block text-sm font-bold text-on-surface group-has-[:checked]:text-primary transition-colors">MANUAL</span>
<span class="block text-[10px] text-on-surface-variant mt-0.5">Step-by-step review</span>
</div>
</div>
</label>
</div>
</div>
<!-- Action Footer -->
<div class="flex items-center justify-end gap-4 pt-4">
<button class="text-primary text-sm font-bold px-4 py-2 hover:bg-primary/10 rounded transition-colors" type="button">
            Cancel
          </button>
<button class="relative overflow-hidden group bg-gradient-to-br from-primary-container to-primary text-on-primary-container px-8 py-3 rounded-xl font-bold flex items-center gap-3 transition-transform active:scale-95 shadow-lg shadow-primary/20" type="submit">
<span>Create</span>
<!-- Spinner -->
<div class="w-5 h-5 border-2 border-on-primary-container/30 border-t-on-primary-container rounded-full animate-spin"></div>
<!-- Gradient Overlay Shine -->
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
</button>
</div>
</form>
<!-- Signature Asymmetric Accent -->
<div class="absolute top-0 right-0 w-24 h-24 bg-primary/5 rounded-full blur-3xl -mr-12 -mt-12 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-32 h-32 bg-primary-container/5 rounded-full blur-3xl -ml-16 -mb-16 pointer-events-none"></div>
</div>
</div>
</body></html>
